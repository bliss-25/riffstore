<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | RIFFSTORE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="../styles/login.css">
</head>

<body>

<div class="wrapper">

  <div class="glass">



    <!-- MAIN -->
    <div class="content">

      <!-- LEFT -->
      <div class="left">

        <p class="small">MUSIC MARKETPLACE</p>

        <h1>
          POWERED BY <br>
          MUSIC LOVERS <br>
          AROUND THE WORLD.
        </h1>

        <p class="sub">Don’t have account?</p>
        <a href="signup.html">Create account →</a>

        <!-- SMALL IMAGE CARD -->
        <div class="small-card">
          <img src="../assets/image/login.jpeg">
          <div class="card-overlay">
            <h4>About Riffstore</h4>
            <p>Premium instruments & lessons</p>
          </div>
        </div>

      </div>

      <!-- RIGHT -->
      <div class="right">

        <img src="../assets/image/login.jpeg" class="bg-img">

        <!-- LOGIN CARD -->
        <div class="login-card">

      <h3>Login to your account</h3>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<div class="options">
  <label class="remember">
    <input type="checkbox" id="remember">
    <span>Remember me</span>
  </label>

  <button type="button" id="forgotBtn" class="forgot-btn">
    Forgot your password?
  </button>
</div>

<button type="button" id="loginBtn">Login</button>
        </div>

      </div>

    </div>

  </div>

</div>
<script src="../scripts/login.js"></script>

<script>
  const user = JSON.parse(localStorage.getItem("user"));

  if (user) {
    window.location.href = "index.html";
  }
</script>
</body>
</html>
