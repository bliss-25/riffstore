<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Checkout | RIFFSTORE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../styles/checkout.css">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

  <!-- NAVBAR -->

  <nav class="navbar">


<div class="logo" onclick="window.location.href='../index.html'">
  RIFFSTORE
</div>

<div class="nav-icons">

  <!-- SEARCH -->
  <div class="search-container" id="searchBox">
    <i class="fa-solid fa-magnifying-glass search-icon"></i>
    <input type="text" id="searchInput" placeholder="Search instruments...">
  </div>

  <!-- WISHLIST -->
  <div class="icon" onclick="window.location.href='wishlist.html'">
    <i class="fa-regular fa-heart"></i>
  </div>

  <!-- CART -->
  <div class="icon" onclick="window.location.href='cart.html'">
    <i class="fa-solid fa-bag-shopping"></i>
  </div>

</div>


  </nav>

  <!-- MAIN -->

  <div class="checkout-container">


<!-- LEFT SIDE -->
<div class="checkout-left">

  <h2>Shipping Address</h2>

  <div class="row">
    <input id="firstName" placeholder="First Name*">
    <input id="lastName" placeholder="Last Name*">
  </div>

  <input id="email" placeholder="Email*">
  <input id="phone" placeholder="Phone Number*">

  <div class="row">
    <input id="city" placeholder="City*">

    <!-- ✅ FULL STATE LIST -->
    <select id="state">
      <option value="">Select State*</option>
      <option>Andhra Pradesh</option>
      <option>Arunachal Pradesh</option>
      <option>Assam</option>
      <option>Bihar</option>
      <option>Chhattisgarh</option>
      <option>Goa</option>
      <option>Gujarat</option>
      <option>Haryana</option>
      <option>Himachal Pradesh</option>
      <option>Jharkhand</option>
      <option>Karnataka</option>
      <option>Kerala</option>
      <option>Madhya Pradesh</option>
      <option>Maharashtra</option>
      <option>Manipur</option>
      <option>Meghalaya</option>
      <option>Mizoram</option>
      <option>Nagaland</option>
      <option>Odisha</option>
      <option>Punjab</option>
      <option>Rajasthan</option>
      <option>Sikkim</option>
      <option>Tamil Nadu</option>
      <option>Telangana</option>
      <option>Tripura</option>
      <option>Uttar Pradesh</option>
      <option>Uttarakhand</option>
      <option>West Bengal</option>
      <option>Delhi</option>
    </select>

    <input id="pincode" placeholder="Pincode*" maxlength="6">
  </div>

  <!-- ✅ NEW FIELDS -->
  <input id="house" placeholder="House No / Building Name*">
  <input id="landmark" placeholder="Landmark (optional)">

  <textarea id="address" placeholder="Full Address*"></textarea>

  <!-- SHIPPING -->
  <h3>Shipping Method</h3>

  <div class="shipping-options">

    <div class="shipping-card active" onclick="selectShipping(0, this)">
      <div>
        <p><strong>Free Shipping</strong></p>
        <small>7–10 Days</small>
      </div>
      <span>₹0</span>
    </div>

    <div class="shipping-card" onclick="selectShipping(100, this)">
      <div>
        <p><strong>Express Shipping</strong></p>
        <small>1–3 Days</small>
      </div>
      <span>₹100</span>
    </div>

  </div>

</div>

<!-- RIGHT SIDE -->
<div class="checkout-right">

  <h3>Your Cart</h3>

  <div id="checkoutItems"></div>

  <!-- DISCOUNT -->
<div class="discount-box">
  <input type="text" id="discountCode" placeholder="Discount code">
  <button onclick="applyDiscount()">Apply</button>
</div>

  <p class="discount-note">
    🎉 Use code <b>RIFF10</b> and save 10% instantly
  </p>

  <!-- TOAST -->
<div id="toast"></div>

  <!-- SUMMARY -->
  <div class="summary">
    <p>Subtotal <span id="subtotal">₹0</span></p>
    <p>Discount <span id="discount">₹0</span></p>
    <p>Shipping <span id="shippingCost">₹0</span></p>
    <p>Tax <span id="tax">₹0</span></p>

    <hr>

    <p class="total">Total <span id="total">₹0</span></p>
  </div>

  <button class="pay-btn" onclick="placeOrder()">
    Continue to Payment
  </button>

</div>


  </div>

  <script src="../scripts/checkout.js"></script>

</body>
</html>
