<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment Success | RIFFSTORE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="../styles/style.css">
<link rel="stylesheet" href="../styles/success.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="success-card">

  <div class="icon">
    <i class="fa-solid fa-check"></i>
  </div>

  <h2>Payment Successful</h2>
  <p class="sub-text">Thanks for your order — it's now confirmed.</p>

  <div class="details">
    <h4>Payment Details</h4>

    <div class="row">
      <span>Transaction ID</span>
      <span id="orderId"></span>
    </div>

    <div class="row">
      <span>Date</span>
      <span id="orderDate"></span>
    </div>

    <div class="row">
      <span>Type</span>
      <span>Demo Payment</span>
    </div>

    <div class="row">
      <span>Total</span>
      <span id="orderTotal"></span>
    </div>

    <div class="row">
      <span>Status</span>
      <span class="status">Success</span>
    </div>

  </div>

  <button class="track-btn" onclick="goToOrders()">Track Your Order</button>
  <button class="home-btn" onclick="goHome()">Back to Home</button>

</div>

<script src="../scripts/success.js"></script>

</body>
</html>
