<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile</title>

<link rel="stylesheet" href="../styles/profile.css">
</head>

<body>

<div class="container">

  <h1 class="page-title">My Account</h1>

  <div class="profile-layout">

    <!-- LEFT SIDEBAR -->
    <div class="sidebar">

      <div class="user-box">
        <p class="hello">Hello, User</p>
        <p class="sub">Manage your account</p>
      </div>

      <div class="menu">
        <p onclick="loadSection('profile')">Profile</p>
        <p onclick="loadSection('orders')">Orders</p>
        <p onclick="loadSection('wishlist')">Wishlist</p>
        <p onclick="loadSection('address')">Address</p>
        <p onclick="loadSection('cart')">Cart</p>
        <p onclick="loadSection('lessons')">Lessons</p>
        <p onclick="loadSection('contact')">Contact</p>
      </div>

    </div>

<button onclick="logout()">Logout</button>

    <!-- RIGHT CONTENT -->
    <div class="content" id="content"></div>

  </div>

</div>

<script src="../scripts/profile.js"></script>
<script>
function logout() {
  localStorage.removeItem("user");
  window.location.href = "login.html";
}
</script>
</body>
</html>
